# Deploys the rankings + updates Worker:  npx wrangler deploy --keep-vars   (from this folder)
# Secrets (UGS_KEY_ID, UGS_SECRET_KEY, UGS_PROJECT_ID, UGS_ENVIRONMENT_ID) live in Cloudflare and are kept on deploy.
# Email for account codes (website): secret BREVO_API_KEY and variable MAIL_FROM (a sender verified in Brevo):
#   npx wrangler secret put BREVO_API_KEY      npx wrangler secret put MAIL_FROM
name = "octive-rankings-api"
main = "worker.js"
compatibility_date = "2026-11-10"
workers_dev = true
preview_urls = false

# game updates (Tools/publish_release.py uploads here; the Worker serves /releases/...)
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "octive-releases"

# Discord server boosters: re-checked every 6 hours (needs DISCORD_GUILD_ID and the DISCORD_BOT_TOKEN secret)
[triggers]
crons = ["0 */6 * * *"]

# the OCTIVE Discord server and its "OCTIVE Supporter" role (the bot token is the secret DISCORD_BOT_TOKEN)
[vars]
DISCORD_GUILD_ID = "1167928565065601175"
DISCORD_SUPPORTER_ROLE_ID = "1570329712826253445"
# Workshop files (Backblaze B2, S3 API); the key is the B2_KEY_ID / B2_APP_KEY secrets
B2_BUCKET = "octive-workshop"
B2_ENDPOINT = "s3.us-east-005.backblazeb2.com"
